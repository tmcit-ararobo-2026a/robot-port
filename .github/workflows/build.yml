name: CI
on:
  push:
    branches: [ "main", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main", "feat/**", "fix/**" ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros2_build:
    name: ROS 2 Humble Build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: ros:humble-ros-base

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ros2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-ros2-${{ runner.os }}-

      - name: Build
        run: |
          set -e

          source /opt/ros/humble/setup.bash

          DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install -y git ccache

          export CCACHE_DIR=${{ github.workspace }}/.ccache
          export PATH="/usr/lib/ccache:$PATH"
          mkdir -p $CCACHE_DIR
          ccache --max-size=500M

          rosdep update --rosdistro humble
          rosdep install --from-paths . --skip-keys gn10_can -y --rosdistro humble

          colcon --log-base "${{ runner.temp }}/robot-port-log" build \
            --build-base "${{ runner.temp }}/robot-port-build" \
            --install-base "${{ runner.temp }}/robot-port-install" \
            --cmake-args \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DBUILD_FOR_ROS2=ON
      - name: Test
        run: |
          set -e
          source /opt/ros/humble/setup.bash
          source "${{ runner.temp }}/robot-port-install/setup.bash"
          colcon --log-base "${{ runner.temp }}/robot-port-test-log" test \
            --build-base "${{ runner.temp }}/robot-port-build" \
            --install-base "${{ runner.temp }}/robot-port-install" \
            --event-handlers console_direct+
          colcon test-result --test-result-base "${{ runner.temp }}/robot-port-build" --verbose
