name: CI
on:
  push:
    branches: [ "main", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main", "feat/**", "fix/**" ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros2_build:
    name: ROS 2 Humble Build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: ros:humble-ros-base

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ros2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-ros2-${{ runner.os }}-

      - name: Build
        run: |
          set -e

          source /opt/ros/humble/setup.bash

          DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install -y git ccache

          export CCACHE_DIR=${{ github.workspace }}/.ccache
          export PATH="/usr/lib/ccache:$PATH"
          mkdir -p $CCACHE_DIR
          ccache --max-size=500M

          rosdep update --rosdistro humble
          rosdep install --from-paths . --skip-keys gn10_can -y --rosdistro humble

          colcon --log-base "${{ runner.temp }}/robot-port-log" build \
            --build-base "${{ runner.temp }}/robot-port-build" \
            --install-base "${{ runner.temp }}/robot-port-install" \
            --cmake-args \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Test
        run: |
          set -e
          source /opt/ros/humble/setup.bash
          source "${{ runner.temp }}/robot-port-install/setup.bash"
          colcon --log-base "${{ runner.temp }}/robot-port-test-log" test \
            --build-base "${{ runner.temp }}/robot-port-build" \
            --install-base "${{ runner.temp }}/robot-port-install" \
            --event-handlers console_direct+
          colcon test-result --test-result-base "${{ runner.temp }}/robot-port-build" --verbose
      - name: Standalone standard-message smoke
        run: |
          set -e
          source /opt/ros/humble/setup.bash
          source "${{ runner.temp }}/robot-port-install/setup.bash"
          export ROS_LOCALHOST_ONLY=1
          export ROS_DOMAIN_ID=214
          export ROS_LOG_DIR="${{ runner.temp }}/robot-port-ros-logs"
          python3 - <<'PY'
          import socket
          import subprocess
          from pathlib import Path

          from ament_index_python.packages import get_package_prefix

          prefix = Path(get_package_prefix('robot_port'))
          executable = prefix / 'lib' / 'robot_port' / 'udp_node'
          assert executable.is_file(), f'Installed udp_node not found: {executable}'
          assert not list(prefix.rglob('*.msg')), 'Unexpected custom ROS interfaces'
          with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as command, \
                  socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as operation:
              command.bind(('127.0.0.2', 0))
              operation.bind(('127.0.0.2', 0))
              operation.settimeout(5)
              command_port = command.getsockname()[1]
              operation_port = operation.getsockname()[1]
              assert command_port != operation_port
              process = subprocess.Popen([
                  str(executable), '--ros-args',
                  '-p', 'local_address:=127.0.0.1', '-p', 'peer_address:=127.0.0.2',
                  '-p', f'command_port:={command_port}',
                  '-p', f'operation_port:={operation_port}',
              ])
              try:
                  for _ in range(3):
                      packet, source = operation.recvfrom(2048)
                      assert source == ('127.0.0.1', operation_port)
                      assert packet == bytes([0xAB]) + bytes(31), packet.hex()
                  print('Standalone startup: three zero-speed Stanby packets; no custom msg files')
              finally:
                  process.terminate()
                  process.wait(timeout=5)
          PY
